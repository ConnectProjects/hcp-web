<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Hearing</title>
  <link rel="stylesheet" href="app.css">
  <!--
    sql.js UMD build — exposes window.initSqlJs globally.
    Must load before app.js so the login screen can call it.
    graph-store path will also need msal-browser.min.js here (add when IT grants registration).
  -->
  <script src="./vendor/sql-wasm.js"></script>
  <script src="./vendor/jszip.min.js"></script>
</head>
<body>
  <div class="print-header" aria-hidden="true">Connect Hearing — Hearing Conservation Program</div>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" hidden>
      <div class="sidebar-logo">
        <img src="../shared/techtool banner.png" alt="Connect Hearing" class="sidebar-banner">
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div id="sidebar-footer" class="sidebar-footer"></div>
    </aside>
    <main id="screen" class="screen"></main>
    <div id="brand-corner" class="brand-corner" hidden>
      <img src="../favicon.ico" alt="" class="brand-favicon">
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
